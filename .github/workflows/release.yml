name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# One run per tag/ref. Do NOT cancel in-progress: matrix jobs share the group
# and a second dispatch must not kill an active multi-platform build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macOS Apple Silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macOS Intel
          - platform: ubuntu-22.04
            args: ""
            name: Linux x64
          - platform: windows-latest
            args: ""
            name: Windows x64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Prefer the pushed tag (v0.1.1), not a mismatched __VERSION__ from config.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: Finance ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Сборки Finance для desktop.

            ## Установка
            - **macOS**: `.dmg` (Apple Silicon или Intel)
            - **Windows**: `.msi` / `.exe`
            - **Linux**: `.AppImage` / `.deb`

            Данные приложения локальные (SQLite). Перед обновлением полезно сделать бэкап во вкладке «Данные».
          # Attach binaries to the real release the tag points at (not a separate draft).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
